name: namt_oil_mil
description: Namt Oil Mil — offline-first digital khata for oil-mill businesses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Database (offline-first)
  drift: ^2.28.1
  sqlite3: ^3.4.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

  # Documents & sharing
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  file_picker: ^8.3.7

  # Charts
  fl_chart: ^0.69.2

  # Secure storage (PIN)
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
